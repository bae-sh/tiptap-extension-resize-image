version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @rollup/plugin-typescript does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node on the oldest Node version in the CI matrix.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
