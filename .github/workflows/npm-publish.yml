# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: NPM Package Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: yarn
        # registry-url makes setup-node write an .npmrc containing
        # _authToken=${NODE_AUTH_TOKEN}. Since v7 that file is written before the
        # `cache: yarn` restore, so setup-node's own `yarn cache dir` call reads it
        # and yarn 1.x aborts on the unresolvable variable. Publishing here uses
        # OIDC trusted publishing, so no token exists; define it as empty for this
        # step only. npm tolerates the unresolved value at publish time.
        env:
          NODE_AUTH_TOKEN: ''
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - run: npm install -g npm@11
      - run: npm --version
      - run: npm publish --provenance
